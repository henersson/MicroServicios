# Configuración de Alembic para el revision-service.
#
# La URL de la base de datos NO se pone aquí: la lee migrations/env.py de la
# configuración del servicio, que a su vez la toma de las variables de entorno.
# Así no hay credenciales en un archivo versionado y las migraciones funcionan
# igual en local y dentro de Docker.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Las revisiones llevan fecha en el nombre para que el orden sea evidente al
# listarlas, aunque el orden real lo marque la cadena down_revision.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
