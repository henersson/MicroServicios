# Configuracion de RabbitMQ para el entorno de desarrollo del Taller 2.
# Formato "new style" (sysctl), soportado desde RabbitMQ 3.7.

# Carga la topologia (exchange, DLX, colas, DLQ, bindings, usuario y permisos)
# al arrancar el nodo. OJO: con load_definitions activo RabbitMQ ignora
# RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS, por eso el usuario 'saberpro'
# va declarado dentro del propio definitions.json.
load_definitions = /etc/rabbitmq/definitions.json

# Escucha AMQP en todas las interfaces del contenedor para que los servicios
# de la red saberpro-net puedan conectarse.
listeners.tcp.default = 5672

# Interfaz de administracion (http://localhost:15672, usuario saberpro).
management.tcp.port = 15672

# En desarrollo interesa ver el detalle de conexiones y consumidores.
log.console = true
log.console.level = info

# Corta las publicaciones cuando la memoria del nodo supera el 70% del limite,
# en vez del 40% por defecto: evita bloqueos molestos al levantar todo junto
# en un portatil.
vm_memory_high_watermark.relative = 0.7

# Umbral de disco libre. Con menos espacio RabbitMQ bloquea a los productores.
disk_free_limit.absolute = 1GB
