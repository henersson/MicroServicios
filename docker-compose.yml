networks:
  # Nombre fijo para que los companeros puedan conectar su simulacros-service
  # con `docker network connect saberpro-net <contenedor>` o declarandola
  # como red externa en su propio compose.
  saberpro-net:
    name: saberpro-net
    driver: bridge

volumes:
  rabbitmq-datos:
    name: saberpro-rabbitmq-datos
  postgres-banco-datos:
    name: saberpro-postgres-banco-datos
  postgres-revision-datos:
    name: saberpro-postgres-revision-datos
  # postgres-simulacros-datos:
  #   name: saberpro-postgres-simulacros-datos
