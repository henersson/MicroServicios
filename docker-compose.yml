  #   networks:
  #     - saberpro-net

  # ── Microservicio del Bounded Context "Simulacros y Reportes" ─────────────
  # simulacros-service:
  #   build:
  #     # El contexto es la RAIZ del repositorio, igual que en los otros dos:
  #     # hace falta para poder generar el cliente gRPC desde contracts/proto.
